<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure Election System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-start: #f5f7fb;
            --bg-end: #dfe7f2;
            --panel: rgba(255, 255, 255, 0.92);
            --panel-strong: #ffffff;
            --ink: #102033;
            --muted: #617083;
            --line: rgba(16, 32, 51, 0.12);
            --primary: #0c6b58;
            --primary-dark: #084f41;
            --accent: #d9a441;
            --danger-soft: #fde7e7;
            --success-soft: #e6f7ef;
            --shadow: 0 18px 48px rgba(16, 32, 51, 0.14);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(217, 164, 65, 0.24), transparent 26%),
                radial-gradient(circle at top right, rgba(12, 107, 88, 0.18), transparent 28%),
                linear-gradient(160deg, var(--bg-start), var(--bg-end));
        }

        .site-shell {
            min-height: 100vh;
            padding: 32px 0 48px;
        }

        .site-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(16, 32, 51, 0.9);
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.04em;
            font-weight: 700;
        }

        .site-brand-mark {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd66b, #c88719);
            box-shadow: 0 0 0 6px rgba(255, 214, 107, 0.12);
        }

        .hero-panel,
        .content-panel,
        .candidate-card,
        .media-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .hero-panel,
        .content-panel,
        .media-panel {
            padding: 28px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(12, 107, 88, 0.12);
            color: var(--primary-dark);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .page-title {
            margin: 18px 0 10px;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.05;
            font-weight: 800;
        }

        .page-subtitle {
            max-width: 650px;
            color: var(--muted);
            font-size: 1.02rem;
        }

        .content-panel h3,
        .media-panel h3 {
            font-weight: 700;
        }

        .form-control,
        .form-select {
            min-height: 52px;
            border-radius: var(--radius-sm);
            border-color: rgba(16, 32, 51, 0.15);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: rgba(12, 107, 88, 0.45);
            box-shadow: 0 0 0 0.2rem rgba(12, 107, 88, 0.14);
        }

        .btn {
            min-height: 48px;
            border-radius: 999px;
            font-weight: 700;
            padding-inline: 20px;
        }

        .btn-brand {
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
        }

        .btn-brand:hover,
        .btn-brand:focus {
            color: #fff;
            background: linear-gradient(135deg, #0b5d4d, #073e34);
        }

        .btn-accent {
            color: var(--ink);
            background: linear-gradient(135deg, #f0cb74, var(--accent));
            border: none;
        }

        .btn-outline-brand {
            border: 1px solid rgba(12, 107, 88, 0.3);
            color: var(--primary-dark);
            background: rgba(12, 107, 88, 0.05);
        }

        .info-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .info-chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(16, 32, 51, 0.06);
            color: var(--ink);
            font-size: 0.95rem;
        }

        .candidate-card {
            height: 100%;
            padding: 18px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .candidate-card:hover {
            transform: translateY(-3px);
            border-color: rgba(12, 107, 88, 0.24);
        }

        .candidate-option {
            display: block;
            cursor: pointer;
        }

        .candidate-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .candidate-option input:checked + .candidate-card {
            border-color: rgba(12, 107, 88, 0.48);
            box-shadow: 0 22px 50px rgba(12, 107, 88, 0.18);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(231, 246, 241, 0.95));
        }

        .candidate-photo,
        .camera-frame {
            width: 100%;
            border-radius: var(--radius-md);
            background: #09131f;
            object-fit: cover;
        }

        .candidate-photo {
            height: 220px;
            border: 1px solid rgba(16, 32, 51, 0.08);
        }

        .camera-frame {
            min-height: 260px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .status-box {
            border-radius: var(--radius-md);
            border: 1px solid rgba(16, 32, 51, 0.08);
            background: var(--panel-strong);
            padding: 18px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.68);
            border: 1px solid rgba(16, 32, 51, 0.08);
        }

        .metric-badge {
            min-width: 72px;
            padding: 8px 12px;
            border-radius: 999px;
            text-align: center;
            background: rgba(12, 107, 88, 0.12);
            color: var(--primary-dark);
            font-weight: 700;
        }

        .message-panel {
            max-width: 720px;
            margin: 0 auto;
        }

        .soft-success {
            background: var(--success-soft);
            border-color: rgba(12, 107, 88, 0.16);
        }

        .soft-danger {
            background: var(--danger-soft);
            border-color: rgba(185, 53, 53, 0.14);
        }

        @media (max-width: 767.98px) {
            .site-shell {
                padding-top: 20px;
            }

            .hero-panel,
            .content-panel,
            .media-panel {
                padding: 20px;
                border-radius: 20px;
            }

            .page-title {
                font-size: 2rem;
            }

            .candidate-photo {
                height: 200px;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="site-shell">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/" class="site-brand">
                    <span class="site-brand-mark"></span>
                    <span>Secure Election System</span>
                </a>
                {% block header_actions %}{% endblock %}
            </div>
            {% block content %}{% endblock %}
        </div>
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
