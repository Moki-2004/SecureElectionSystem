<!DOCTYPE html>
<html>
<head>
    <title>Face Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 text-center">

        <h3 class="mb-2">📸 Face Registration</h3>
        <p class="text-muted">Look at the camera and capture your face</p>

        <video id="video" width="300" autoplay class="border rounded"></video>
        <br><br>

        <button class="btn btn-primary" onclick="capture()">
            Capture Face
        </button>

        <form method="post" enctype="multipart/form-data" id="faceForm">
            {% csrf_token %}
            <input type="hidden" name="image_data" id="imageData">
        </form>

        <p class="text-muted mt-3">One-time registration</p>
    </div>
</div>

<script>
function capture() {
    alert("Face captured successfully!");
    document.getElementById("faceForm").submit();
}
</script>

</body>
</html>
